name: Nightly price sync

on:
  schedule:
    # Every 4 hours. TCGCSV is only re-read when it has a new daily build (around 20:00 UTC);
    # the other runs just refresh eBay listings, which may be shown for at most six hours.
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Re-read every set's product list (full refresh)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SYNC_USER_AGENT: BoxHeatmap/1.0 (github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull today's prices
        run: node scripts/sync.mjs ${{ inputs.full && '--force' || '' }}

      # Runs once, on the first sync: fetches three archive days so 1/7/30-day changes
      # work immediately. Dates are recorded so no archive is ever downloaded twice.
      - name: Backfill history (first run only)
        if: hashFiles('data/backfilled.json') == ''
        run: |
          node scripts/backfill.mjs 1 7 30
          node scripts/sync.mjs --build

      # Skipped automatically until the EBAY_CLIENT_ID and EBAY_CLIENT_SECRET secrets exist.
      # Never fails the job: a failed step (even with continue-on-error) makes the Pages upload
      # action skip its internal steps, so the site would not publish. Failures show as a warning.
      - name: eBay asking prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node scripts/ebay.mjs || echo "::warning::eBay asking prices failed; publishing without them. See the log above."

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.json
          git diff --cached --quiet || git commit -m "Prices for $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
